name: Raffle UI CI/CD

on:
  push:
    branches: [aws-ec2-deploy]
    paths:
      - 'raffle-ui/**'

# Repository'ga yangilangan package.json faylini push qilish uchun huquq beramiz
permissions:
  contents: write
  id-token: write # AWS OIDC orqali xavfsiz ulanish uchun SHART

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js (Version bump uchun)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. Version'ni +1 ga oshirish (Faqat package.json)
      - name: Bump Version & Update Helm values.yaml
        run: |
          # raffle-ui papkasiga o'tib, patch versionni oshiramiz (0.1.0 -> 0.1.1)
          cd raffle-ui
          NEW_VER=$(npm version patch --no-git-tag-version)
          CLEAN_VER=${NEW_VER#v} # 'v' harfini olib tashlaymiz -> "0.1.1"
          cd ..

          echo "NEW_VERSION=$CLEAN_VER" >> $GITHUB_ENV
          echo "Yangi versiya: $CLEAN_VER"

      # 2. AWS Credentials (OIDC orqali xavfsiz ulanish)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1 # O'zingizning regioningiz (Masalan: us-east-1)

      # 3. AWS ECR ga Login qilish
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Docker Image'ni Build va Push qilish (AWS ECR'ga)
      - name: Build and Push Docker Image to ECR
        uses: docker/build-push-action@v6
        with:
          context: ./raffle-ui
          file: ./raffle-ui/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/dev-raffle-app:${{ env.NEW_VERSION }}
            ${{ steps.ecr-login.outputs.registry }}/dev-raffle-app:latest
          build-args: |
            NEXT_PUBLIC_SEPOLIA_RPC_URL=${{ secrets.NEXT_PUBLIC_SEPOLIA_RPC_URL }}
            NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID=${{ secrets.NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

# 5. Yangilangan package.json faylini Git'ga push qilish
      - name: Commit and Push package.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add raffle-ui/package.json
          git commit -m "chore(release): bump version to ${{ env.NEW_VERSION }} [skip ci]" || echo "No changes to commit"
          git push

