# argocd.yaml
redis-ha:
  enabled: false

controller:
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
server:
  replicas: 1
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
repoServer:
  replicas: 1
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

global:
  domain: argocd.example.com # Buni o'z domeningizga o'zgartirasiz

# certificate:
  # enabled: true

server:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      # AWS dagi Nginx Ingress orqali ArgoCD (gRPC) ga ulanish uchun zarur anotatsiyalar
      nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
      nginx.ingress.kubernetes.io/ssl-passthrough: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    tls: true